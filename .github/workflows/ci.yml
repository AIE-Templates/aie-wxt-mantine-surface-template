name: Validate template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm prettier:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit:css && pnpm audit:ascii && pnpm audit:surface
      - run: pnpm build:firefox
      - run: pnpm audit:css:firefox && pnpm audit:ascii:firefox && pnpm audit:surface:firefox
      - run: pnpm zip && pnpm zip:firefox
      - name: Verify zip archives exist and exclude audit-only surface-css
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const { existsSync, readFileSync } = require("node:fs");
            const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
            for (const target of ["chrome", "firefox"]) {
              const zip = `.output/${name}-${version}-${target}.zip`;
              if (!existsSync(zip)) throw new Error(`Missing expected package archive: ${zip}`);
              const list = execFileSync("unzip", ["-Z1", zip], { encoding: "utf8" });
              if (list.split(/\r?\n/).some((entry) => entry.startsWith("surface-css/"))) {
                throw new Error(`${zip} must exclude surface-css/`);
              }
            }
          '
