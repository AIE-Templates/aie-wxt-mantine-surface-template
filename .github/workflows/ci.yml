name: Validate template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit:css && pnpm audit:ascii && pnpm audit:surface
      - run: pnpm build:firefox
      - run: pnpm audit:css:firefox && pnpm audit:ascii:firefox && pnpm audit:surface:firefox
